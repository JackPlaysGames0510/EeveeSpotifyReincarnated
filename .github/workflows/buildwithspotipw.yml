name: Build IPA with spoti.pw 

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        default: "Master"
        required: true
        type: string
      ipa_url:
        description: "URL to a decrypted Spotify IPA (optional — IPA build is skipped if empty)"
        default: ""
        required: false
        type: string
      patch_ipa:
        description: "Patch the built IPA with zxPluginsInject (ipapatch)"
        default: false
        required: false
        type: boolean
      upload_method:
        description: "Where to upload the built IPA"
        default: "artifacts"
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          # releases/latest/download redirect avoids api.github.com rate limit (anon 60/hr -> 403)
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
              -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      - name: Build EeveeSwiftProtobuf.framework from source
        env:
          SWIFTPROTOBUF_VERSION: ${{ env.SWIFTPROTOBUF_VERSION }}
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      # ─── Build both tweaks and package them into ONE .deb ──────────────

      - name: Build EeveeSpotify .deb (rootless)
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          EEVEE_DEB=$(find packages -name "com.eevee.spotify_*.deb" | head -1)
          [ -n "$EEVEE_DEB" ] || { echo "EeveeSpotify deb not produced" >&2; exit 1; }
          echo "EEVEE_DEB=$EEVEE_DEB" >> $GITHUB_ENV
          echo "EEVEE_DEB_NAME=$(basename "$EEVEE_DEB")" >> $GITHUB_ENV
          echo "==> EeveeSpotify deb: $EEVEE_DEB"

      - name: Build spoti.pw (spotifyglass) .deb
        if: ${{ inputs.ipa_url != '' }}
        run: |
          SPOTIPW_DIR="$RUNNER_TEMP/spoti.pw"
          rm -rf "$SPOTIPW_DIR"
          git clone --depth 1 https://github.com/SideloadLabs/spoti.pw.git "$SPOTIPW_DIR"
          cd "$SPOTIPW_DIR"
          export THEOS
          # The flag table is generated from the decrypted Spotify IPA and gitignored
          # upstream; generate it the same way spoti.pw's own pipeline.sh does so the
          # standalone tweak build links. Needs macOS tools: otool/nm/strings (present).
          wget "${{ inputs.ipa_url }}" --no-verbose -O "$RUNNER_TEMP/flags-ipa"
          python3 scripts/extract-flags.py "$RUNNER_TEMP/flags-ipa"
          echo "==> building spotifyglass tweak"
          gmake -C tweak clean package >/dev/null
          SPOTIPW_DEB="$(ls -t tweak/packages/*.deb | head -1)"
          [ -n "$SPOTIPW_DEB" ] || { echo "spoti.pw deb not produced" >&2; exit 1; }
          echo "SPOTIPW_DEB=$SPOTIPW_DEB" >> $GITHUB_ENV
          echo "SPOTIPW_DIR=$SPOTIPW_DIR" >> $GITHUB_ENV
          echo "    $SPOTIPW_DEB"

      - name: Merge both tweaks into one .deb
        if: ${{ inputs.ipa_url != '' }}
        run: |
          COMBO_DIR="$RUNNER_TEMP/combo-deb"
          rm -rf "$COMBO_DIR"
          mkdir -p "$COMBO_DIR"

          # Extract EeveeSpotify deb contents first.
          dpkg-deb -R "$EEVEE_DEB" "$COMBO_DIR/eevee"
          cp -a "$COMBO_DIR/eevee"/* "$COMBO_DIR/"

          # Extract spoti.pw deb contents and fold its dylib + plist in.
          SPOTIPW_EXTRACT="$RUNNER_TEMP/spotipw-extract"
          mkdir -p "$SPOTIPW_EXTRACT"
          dpkg-deb -R "$SPOTIPW_DEB" "$SPOTIPW_EXTRACT"

          SG_DYLIB=$(find "$SPOTIPW_EXTRACT" -name 'spotifyglass.dylib' | head -1)
          [ -n "$SG_DYLIB" ] || { echo "spotifyglass.dylib not found in spoti.pw deb" >&2; exit 1; }
          mkdir -p "$COMBO_DIR/Library/MobileSubstrate/DynamicLibraries"
          cp "$SG_DYLIB" "$COMBO_DIR/Library/MobileSubstrate/DynamicLibraries/spotifyglass.dylib"

          # spoti.pw also ships a spotifyglass.plist; carry it into the combo
          # deb so both tweaks' metadata land together.
          SG_PLIST_DIR=$(find "$SPOTIPW_EXTRACT" -type d -name 'spotifyglass.plist' -exec dirname {} \; | head -1)
          if [ -n "$SG_PLIST_DIR" ]; then
            mkdir -p "$COMBO_DIR/Library/Spotify"
            cp -R "$SG_PLIST_DIR"/* "$COMBO_DIR/Library/Spotify/" 2>/dev/null || true
          fi

          # Produce the combined .deb. Keep Eevee's control metadata so the
          # package still identifies as the EeveeSpotify package.
          COMBO_DEB="packages/combined-com.eevee.spotify-with-glass.deb"
          mkdir -p packages
          dpkg-deb --build "$COMBO_DIR" "$COMBO_DEB" >/dev/null
          echo "COMBO_DEB=$COMBO_DEB" >> $GITHUB_ENV
          echo "COMBO_DEB_NAME=$(basename "$COMBO_DEB")" >> $GITHUB_ENV
          echo "==> combined deb: $COMBO_DEB"
          echo "==> combined deb contents (dynamic libs + frameworks + bundles):"
          dpkg-deb -c "$COMBO_DEB" | grep -E '\.dylib$|\.framework|\.bundle' | head -40

      - name: Upload combined .deb artifact
        if: ${{ inputs.ipa_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMBO_DEB_NAME }}
          path: ${{ env.COMBO_DEB }}
          if-no-files-found: error

      # ─── IPA build (only when ipa_url is provided) ───────────────────

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Validate vanilla IPA
        if: ${{ inputs.ipa_url != '' }}
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/spotify.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"
            exit 1
          fi

      - name: Build zxPluginsInject.dylib
        if: ${{ inputs.ipa_url != '' && inputs.patch_ipa == true }}
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

      - name: LC-inject zxPluginsInject (ipapatch)
        if: ${{ inputs.ipa_url != '' && inputs.patch_ipa == true }}
        run: |
          ipapatch --input "$OUT_IPA" --inplace --noconfirm \
                   --dylib packages/zxPluginsInject.dylib

      - name: Fetch OpenSpotifySafariExtension.appex
        if: ${{ inputs.ipa_url != '' }}
        run: |
          EXT_DIR="$RUNNER_TEMP/OpenSpotifySafariExtension"
          rm -rf "$EXT_DIR"
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension.git "$EXT_DIR"
          EXT_SRC="$EXT_DIR/OpenSpotifySafariExtension.appex"
          [ -e "$EXT_SRC" ] || { echo "OpenSpotifySafariExtension.appex not found in repo" >&2; exit 1; }
          echo "OPENSPOTIFY_APPEX=$EXT_SRC" >> $GITHUB_ENV

      - name: Inject combined deb + framework into IPA (cyan)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          mkdir -p Outputs/IPAS
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"
          mkdir -p "$DEB_EXTRACT"
          dpkg-deb -R "$COMBO_DEB" "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          SG_DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'spotifyglass.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          [ -n "$DYLIB_SRC" ] || { echo "EeveeSpotify.dylib not found in combined deb" >&2; exit 1; }
          [ -n "$SG_DYLIB_SRC" ] || { echo "spotifyglass.dylib not found in combined deb" >&2; exit 1; }

          SPOT_VERSION=$(unzip -p ${{ github.workspace }}/spotify.ipa 'Payload/Spotify.app/Info.plist' \
              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          EEVEE_VERSION=$(grep -E '^Version:' control | awk '{print $2}')
          OUT="Outputs/IPAS/EeveeSpotify-${EEVEE_VERSION}-${SPOT_VERSION}.ipa"

          INJECT=("$DYLIB_SRC" "$SG_DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT+=("$BUNDLE_SRC")

          # -d enable documents, -u drop UISupportedDevices, -m floor MinOS,
          # -c max compress. Watch + native appex strip happens in the next
          # step via Tools/strip-ipa.sh.
          cyan -i ${{ github.workspace }}/spotify.ipa -o "$OUT" \
               -f "${INJECT[@]}" -c 9 -m 15.0 -du
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: Strip incompatible bundles
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/strip-ipa.sh
          Tools/strip-ipa.sh "$OUT_IPA"

      - name: Add OpenSpotifySafariExtension.appex
        if: ${{ inputs.ipa_url != '' }}
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"

          mkdir -p "Payload/Spotify.app/PlugIns"
          cp -R "$OPENSPOTIFY_APPEX" "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"

          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      # NOTE: Removed the post-injection ipapatch step.
      # If you later need it back, restore the "LC-inject zxPluginsInject (ipapatch)" step.

      - name: Strip Watch app (if any survived)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"
          if [ -d "Payload/Spotify.app/com.apple.WatchPlaceholder" ]; then
            rm -rf Payload/Spotify.app/com.apple.WatchPlaceholder
          fi
          if [ -d "Payload/Spotify.app/Watch" ]; then
            rm -rf Payload/Spotify.app/Watch
          fi
          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      - name: Stage alternate app icons
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      - name: Upload IPA artifact
        if: ${{ inputs.ipa_url != '' && (inputs.upload_method == 'artifacts' || inputs.upload_method == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      - name: Upload IPA to filebin.net
        if: ${{ inputs.ipa_url != '' && (inputs.upload_method == 'filebin' || inputs.upload_method == 'both') }}
        run: |
          BIN="eevee-${{ github.run_id }}-${{ github.run_attempt }}"
          FILENAME=$(basename "$OUT_IPA")
          curl -fsS -X POST \
               -H "Content-Type: application/octet-stream" \
               --data-binary "@${OUT_IPA}" \
               "https://filebin.net/${BIN}/${FILENAME}" >/dev/null

          DOWNLOAD_URL="https://filebin.net/${BIN}/${FILENAME}"
          echo "Uploaded to: ${DOWNLOAD_URL}"
          {
            echo "### 📦 filebin.net download"
            echo "- **File:** ${FILENAME}"
            echo "- **URL:** ${DOWNLOAD_URL}"
            echo "- _Filebin auto-deletes bins after a period of inactivity — download promptly._"
          } >> "$GITHUB_STEP_SUMMARY"
